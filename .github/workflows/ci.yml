name: ci

# Actions minutes are capped, so this runs only on a pull request, a version
# tag, or when started by hand. Linux only, one Node version, no matrix.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # typecheck, the package lint (licence headers, banned names, the import
      # boundary) and the unit tests; the tests that need a server are not run.
      - run: npm ci --ignore-scripts && npm run check
